apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edu-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/alexaaa-a/programming-edu-service.git
    targetRevision: main
    path: charts/edu-stack
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
