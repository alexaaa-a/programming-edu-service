apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kafka
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  kafka-dashboard.json: |
    {
      "title": "Kafka (Strimzi)",
      "uid": "kafka-strimzi",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "tags": ["kafka", "strimzi"],
      "panels": [
        {
          "id": 1,
          "title": "Messages In Per Second",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(kafka_server_brokertopicmetrics_messagesin_total[1m])) by (topic)",
              "legendFormat": "{{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Bytes In Per Second",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesin_total[1m])) by (topic)",
              "legendFormat": "{{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Bytes Out Per Second",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesout_total[1m])) by (topic)",
              "legendFormat": "{{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Consumer Group Lag",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(kafka_consumergroup_lag) by (consumergroup, topic)",
              "legendFormat": "{{consumergroup}} / {{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Active Controllers",
          "type": "stat",
          "gridPos": { "x": 0, "y": 16, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(kafka_controller_kafkacontroller_activecontrollercount)",
              "legendFormat": "controllers",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Under-Replicated Partitions",
          "type": "stat",
          "gridPos": { "x": 6, "y": 16, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(kafka_server_replicamanager_underreplicatedpartitions)",
              "legendFormat": "partitions",
              "refId": "A"
            }
          ],
          "options": { "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "title": "Request Total Rate",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 4 },
          "targets": [
            {
              "expr": "sum(rate(kafka_network_requestmetrics_requests_total[1m])) by (request)",
              "legendFormat": "{{request}}",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {}
    }
