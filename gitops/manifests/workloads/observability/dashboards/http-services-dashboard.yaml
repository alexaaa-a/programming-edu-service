apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-http-services
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  http-services-dashboard.json: |
    {
      "title": "HTTP Services (FastAPI)",
      "uid": "http-fastapi",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "15s",
      "tags": ["http", "fastapi", "microservices"],
      "panels": [
        {
          "id": 1,
          "title": "Requests Per Second",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (service, method, handler)",
              "legendFormat": "{{service}} {{method}} {{handler}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "P95 Latency by Service",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le, service))",
              "legendFormat": "p95 {{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status_code=~\"4..|5..\"}[1m])) by (service, status_code)",
              "legendFormat": "{{service}} {{status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Active Requests",
          "type": "stat",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(http_requests_in_progress) by (service)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "P50 / P90 / P99 Latency",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service))",
              "legendFormat": "p50 {{service}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service))",
              "legendFormat": "p90 {{service}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, service))",
              "legendFormat": "p99 {{service}}",
              "refId": "C"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "query": "label_values(http_requests_total, service)",
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {}
    }
