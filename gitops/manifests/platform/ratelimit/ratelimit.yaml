apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  namespace: ratelimit-system
data:
  config.yaml: |
    domain: api-ratelimit
    descriptors:
      - key: path
        rate_limit:
          unit: minute
          requests_per_unit: 120
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ratelimit
  namespace: ratelimit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ratelimit
  template:
    metadata:
      labels:
        app: envoy-ratelimit
    spec:
      containers:
        - name: ratelimit
          image: envoyproxy/ratelimit:master
          env:
            - name: LOG_LEVEL
              value: info
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: valkey.ratelimit-system.svc.cluster.local:6379
            - name: USE_STATSD
              value: "false"
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: grpc
          volumeMounts:
            - name: ratelimit-config
              mountPath: /data/ratelimit/config/config.yaml
              subPath: config.yaml
      volumes:
        - name: ratelimit-config
          configMap:
            name: ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ratelimit
  namespace: ratelimit-system
spec:
  selector:
    app: envoy-ratelimit
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
