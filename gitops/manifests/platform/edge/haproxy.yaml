apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-haproxy
  namespace: edge-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-haproxy
  template:
    metadata:
      labels:
        app: edge-haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.0
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge-haproxy
  namespace: edge-system
spec:
  selector:
    app: edge-haproxy
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
