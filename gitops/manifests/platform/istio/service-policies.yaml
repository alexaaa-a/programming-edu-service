apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: user-service-dr
  namespace: dev
spec:
  host: user-service.dev.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 20
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: task-service-dr
  namespace: dev
spec:
  host: task-service.dev.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 20
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-routing
  namespace: dev
spec:
  hosts:
    - api.edu.local
  gateways:
    - istio-system/public-gateway
  http:
    - match:
        - uri:
            prefix: /api/user
      route:
        - destination:
            host: api-gateway.dev.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
    - match:
        - uri:
            prefix: /api/task
      route:
        - destination:
            host: api-gateway.dev.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
    - match:
        - uri:
            prefix: /api/submission
      route:
        - destination:
            host: api-gateway.dev.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
    - match:
        - uri:
            prefix: /api/agents
      route:
        - destination:
            host: api-gateway.dev.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
    - route:
        - destination:
            host: api-gateway.dev.svc.cluster.local
            port:
              number: 8000
