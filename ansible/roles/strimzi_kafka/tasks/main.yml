---
- name: Ensure Kafka namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ strimzi_namespace }}"

- name: Add Strimzi Helm repository
  kubernetes.core.helm_repository:
    name: strimzi
    repo_url: "{{ strimzi_chart_repo }}"

- name: Install Strimzi Kafka Operator
  kubernetes.core.helm:
    name: "{{ strimzi_release_name }}"
    chart_ref: "{{ strimzi_chart_ref }}"
    chart_version: "{{ strimzi_chart_version }}"
    release_namespace: "{{ strimzi_namespace }}"
    create_namespace: true
    wait: false
    timeout: "{{ strimzi_helm_timeout }}"

- name: Wait until Strimzi Kafka CRD exists
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: kafkas.kafka.strimzi.io
  register: strimzi_kafka_crd
  retries: 40
  delay: 15
  until: strimzi_kafka_crd.resources | length > 0

- name: Wait until Strimzi operator deployment is ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ strimzi_namespace }}"
    name: "{{ strimzi_operator_deployment_name }}"
  register: strimzi_operator_deployment
  retries: 40
  delay: 15
  until:
    - strimzi_wait_for_operator
    - strimzi_operator_deployment.resources | length > 0
    - (strimzi_operator_deployment.resources[0].status.availableReplicas | default(0) | int) > 0
  when: strimzi_wait_for_operator

- name: Apply Kafka cluster custom resource
  kubernetes.core.k8s:
    state: present
    namespace: "{{ strimzi_namespace }}"
    definition: "{{ lookup('template', 'kafka-cluster.yaml.j2') | from_yaml }}"
