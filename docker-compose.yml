x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"

include:
  - path: docker-compose.langfuse.yml

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${AGENT_SERVICE_NEO4J_USER:-neo4j}/${AGENT_SERVICE_NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shared_network

  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    command: uvicorn user_service.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8001:8000"
    networks:
      - shared_network

  task_service:
    build:
      context: .
      dockerfile: task_service/Dockerfile
    command: uvicorn task_service.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8002:8000"
    networks:
      - shared_network

  submission_service:
    build:
      context: .
      dockerfile: submission_service/Dockerfile
    command: uvicorn submission_service.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8003:8000"
    networks:
      - shared_network

  agent_service:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    command: uvicorn agent_service.app.setup.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
      AGENT_SERVICE_LANGFUSE_HOST: ${AGENT_SERVICE_LANGFUSE_HOST:-http://langfuse-web:3000}
      AGENT_SERVICE_NEO4J_URI: ${AGENT_SERVICE_NEO4J_URI:-bolt://neo4j:7687}
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      neo4j:
        condition: service_started
    networks:
      - shared_network
    ports:
      - "8004:8000"

  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    command: uvicorn api_gateway.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *otel-env
    depends_on:
      user_service:
        condition: service_started
      task_service:
        condition: service_started
      submission_service:
        condition: service_started
      agent_service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8005:8000"
    networks:
      - shared_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api_gateway
    ports:
      - "3000:80"
    networks:
      - shared_network

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - shared_network

  otel-collector:
    image: otel/opentelemetry-collector:0.119.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otel-collector.yaml:ro
    networks:
      - shared_network

  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - shared_network

  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    volumes:
      - ./monitoring/promtail-docker.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shared_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - shared_network

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - agent_service
      - alertmanager
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - shared_network

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/compose/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/compose/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - shared_network

networks:
  shared_network:
    driver: bridge

volumes:
  grafana_data:
  tempo_data:
  loki_data:
  neo4j_data:
