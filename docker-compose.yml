services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s

  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    command: uvicorn user_service.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - shared_network

  task_service:
    build:
      context: .
      dockerfile: task_service/Dockerfile
    command: uvicorn task_service.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - shared_network

  submission_service:
    build:
      context: .
      dockerfile: submission_service/Dockerfile
    command: uvicorn submission_service.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8003:8000"
    networks:
      - shared_network

  agent_service:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    command: uvicorn agent_service.app.setup.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shared_network
    ports:
      - "8004:8000"

  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    command: uvicorn api_gateway.app.setup.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - user_service
      - task_service
      - submission_service
      - agent_service
    ports:
      - "8005:8000"
    networks:
      - shared_network

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - agent_service
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - shared_network

networks:
  shared_network:
    driver: bridge
