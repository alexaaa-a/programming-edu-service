global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: user_service
    metrics_path: /metrics
    static_configs:
      - targets: ["user_service:8000"]

  - job_name: task_service
    metrics_path: /metrics
    static_configs:
      - targets: ["task_service:8000"]

  - job_name: submission_service
    metrics_path: /metrics
    static_configs:
      - targets: ["submission_service:8000"]

  - job_name: api_gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api_gateway:8000"]

  - job_name: agent_service
    metrics_path: /metrics
    static_configs:
      - targets: ["agent_service:8000"]

  - job_name: agent_service_domain
    metrics_path: /api/agents/metrics
    static_configs:
      - targets: ["agent_service:8000"]

  - job_name: otel_collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
